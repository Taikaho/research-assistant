name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

defaults:
  run:
    working-directory: backend

jobs:
  # -------------------------------------------------------------------------
  # Unit tests — no external services required
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # CPU-only torch first; the default PyPI wheel pulls in multi-GB CUDA libraries.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/

      - name: Run unit tests
        run: pytest -m unit -v --cov=app --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Integration tests — require a real PostgreSQL + pgvector database
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      db-test:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: research_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # CPU-only torch first; the default PyPI wheel pulls in multi-GB CUDA libraries.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run migrations on test database
        # Verifies that the Alembic migrations are correct and can be applied
        # to a clean database before the integration tests run.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/research_assistant_test
        run: alembic upgrade head

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/research_assistant_test
        run: pytest -m integration -v

  # -------------------------------------------------------------------------
  # Frontend — type check, unit/component tests and production build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      - name: Build
        run: npx vite build
