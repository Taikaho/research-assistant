services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/research_assistant
      STORAGE_PATH: /app/storage
      DEBUG: "false"
      # Persist downloaded embedding model weights across container rebuilds
      EMBEDDING_CACHE_DIR: /models
    volumes:
      - ./storage:/app/storage
      - model_cache:/models
      # Mount source for --reload to pick up changes during development
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: research_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  model_cache:
