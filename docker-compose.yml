# Release configuration: runs the code built into the images.
# For development with auto-reload and a published database port, add the override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Optional settings (OPENAI_API_KEY, LLM_LOCAL_ONLY, OLLAMA_DEFAULT_MODEL, ...).
    # Values under "environment" below take precedence over this file.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/research_assistant
      STORAGE_PATH: /app/storage
      # Persist downloaded embedding model weights across container rebuilds
      EMBEDDING_CACHE_DIR: /models
      # Ollama runs on the host (see README); reach it from the container
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (built in on Docker Desktop)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - model_cache:/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    # No published port: only the backend talks to the database.
    # docker-compose.dev.yml publishes 5432 for local development.
    environment:
      POSTGRES_DB: research_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  model_cache:
