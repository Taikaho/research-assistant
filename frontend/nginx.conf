server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads up to the backend's MAX_UPLOAD_SIZE_MB (50 MB by default).
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploads embed the PDF, chat waits for the LLM and re-indexing can take
        # minutes, all within one request.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Single-page app: unknown paths load index.html and the client router takes over.
    location / {
        try_files $uri /index.html;
    }
}
