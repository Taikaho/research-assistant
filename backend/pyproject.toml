[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "AI-powered scientific document assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.1",
    "pydantic-settings>=2.6.1",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.10",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.17",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.1",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit function scope silences the pytest-asyncio deprecation warning.
# All async integration fixtures are function-scoped, so the default is correct.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Default: run only unit tests. Use `pytest -m integration` for integration tests.
addopts = "-m 'not integration'"
markers = [
    "unit: Unit tests that do not require external services (default)",
    "integration: Integration tests that require a running PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
